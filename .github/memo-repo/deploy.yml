# The only file of tobokegao/memo (as .github/workflows/deploy.yml). It builds the site's
# source from tobokegao/tobokegao.github.io and publishes the /memo/ part as this
# repository's Pages (https://tobokegao.github.io/memo/). Nothing is committed here, so this
# repository does not grow. Started by the site's own workflow (site.yml, job "memo") or by
# hand. The source of this file lives in the site's repository: .github/memo-repo/deploy.yml
name: Deploy /memo/

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "commit or branch of tobokegao/tobokegao.github.io to build"
        default: main

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    uses: tobokegao/tobokegao.github.io/.github/workflows/build.yml@main
    permissions:
      contents: read
    with:
      part: memo
      repository: tobokegao/tobokegao.github.io
      ref: ${{ inputs.ref }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
