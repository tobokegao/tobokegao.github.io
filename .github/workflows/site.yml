name: Update and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job gets only what it needs: build reads the repository, deploy publishes to Pages.
# Actions are pinned to a commit (the tag is in the comment).
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The real site leaves /memo/ to tobokegao/memo (docs/decisions/0022). The preview
  # (tobokegao/tbk-preview) builds everything with its own workflow (preview.yml, 0037).
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      part: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # /memo/ uses this site's fingerprinted CSS and JS, so it is rebuilt from the same commit
  # whenever the site goes out. The token (secret MEMO_DISPATCH_TOKEN) can only start
  # workflows in tobokegao/memo; without it this step says so and stops.
  memo:
    needs: deploy
    if: github.repository == 'tobokegao/tobokegao.github.io'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Rebuild /memo/
        env:
          GH_TOKEN: ${{ secrets.MEMO_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::MEMO_DISPATCH_TOKEN is not set: /memo/ was not rebuilt"; exit 0; fi
          gh workflow run deploy.yml -R tobokegao/memo -f ref="$SHA"
