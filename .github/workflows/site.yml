name: Update and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job gets only what it needs: build reads the repository, deploy publishes to Pages.
# Actions are pinned to a commit (the tag is in the comment).
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.166.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read   # configure-pages reads the Pages settings for the base URL
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install fonttools==4.66.1 brotli==1.2.0

      - name: Install Hugo
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -sSL -o "$deb" "$base/$deb"
          curl -sSL -o checksums.txt "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $deb\$" checksums.txt | sha256sum -c -
          sudo dpkg -i "$deb"

      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Subset dot fonts to the site's characters
        run: python scripts/subset_fonts.py

      - name: Build
        env:
          TZ: Asia/Tokyo
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
