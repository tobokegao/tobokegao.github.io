name: Build site

# Builds the whole site (Hugo, the MEMO search index, the checks) and uploads one part of it
# as a Pages artifact. Called by site.yml here and by the deploy workflow of tobokegao/memo,
# which serves /memo/ (docs/decisions/0022). Both build the same source, so the memo pages
# always match the site's fingerprinted CSS and JS.
on:
  workflow_call:
    inputs:
      part:
        description: "all (preview), site (everything but /memo/) or memo (/memo/ only)"
        type: string
        required: true
      repository:
        description: "the source to build; empty: the calling repository"
        type: string
        default: ""
      ref:
        description: "the commit or branch to build; empty: the one that started the run"
        type: string
        default: ""

permissions: {}

env:
  HUGO_VERSION: 0.166.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install fonttools==4.66.1 brotli==1.2.0 pillow==12.3.0

      - name: Install Hugo
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -sSL -o "$deb" "$base/$deb"
          curl -sSL -o checksums.txt "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $deb\$" checksums.txt | sha256sum -c -
          sudo dpkg -i "$deb"

      - name: Subset dot fonts to the site's characters
        run: python scripts/subset_fonts.py

      - name: Build
        env:
          TZ: Asia/Tokyo
          PART: ${{ inputs.part }}
        # The preview copy in another repository is served under a sub-path:
        # it gets relative links, and search engines are asked to skip it.
        run: |
          if [ "$PART" = "all" ]; then
            HUGO_RELATIVEURLS=true HUGO_PARAMS_PREVIEW=true hugo --minify
          else
            hugo --minify --baseURL "https://tobokegao.github.io/"
          fi

      # Who each memo post is from and to, for from: and to: in the search (public/memo/q),
      # and each month's pictures, for mini Tobokegao (public/memo/m).
      - name: Post index
        run: python scripts/memo_query_index.py public/memo/q public/memo/m

      # The MEMO search index, into public/memo/pagefind (settings in pagefind.yml).
      - name: Search index
        run: npx -y pagefind@1.3.0 --site public

      # The site rules a machine can decide, and every link in the built site (see CLAUDE.md).
      - name: Check
        run: python scripts/check.py --all --site public

      # Each repository publishes only its own part of the address space.
      - name: Keep this part
        env:
          PART: ${{ inputs.part }}
        run: |
          case "$PART" in
            site) rm -rf public/memo ;;
            memo) mv public/memo memo-only && rm -rf public && mv memo-only public ;;
            all) ;;
            *) echo "unknown part: $PART"; exit 1 ;;
          esac

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: public
