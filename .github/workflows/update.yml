name: Update releases and news

# Semi-automatic: runs only when started by hand (Actions tab -> Update releases and news
# -> Run workflow, also from the GitHub mobile app). The result arrives as a pull request;
# merging it publishes the site, closing it discards the update.
#
# Two jobs, so that the steps reading other people's feeds and pages never hold a token
# that can write to the repository: "collect" can only read, and hands data/ to "propose",
# which only opens the pull request. Actions are pinned to a commit (the tag is in the
# comment); to update one, look up the new tag's commit and change both.
on:
  workflow_dispatch:

permissions: {}

# One update at a time: a second run waits for the first instead of racing it to the same
# pull request branch.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install anthropic==1.9.0 pillow==12.3.0

      - name: Fetch releases and videos
        run: python scripts/fetch_feeds.py

      # the cards' covers and thumbnails as the site's own WebP files (data/covers.json
      # says which file stands in for which remote picture)
      - name: Copy new covers and thumbnails to the site
        run: python scripts/cover_cache.py

      - name: Collect news candidates
        run: python scripts/collect_news.py

      - name: Classify news with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/classify_news.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data
          path: |
            data
            static/img/covers
          retention-days: 1

  propose:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: data
          path: .

      - name: Open a pull request for review
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: data/update
          delete-branch: true
          add-paths: |
            data
            static/img/covers
          commit-message: "data: update releases and news"
          title: "Releases and news update"
          body: |
            New releases and videos (`fetch_feeds.py`), their covers as the site's own
            WebP files (`cover_cache.py`) and news chosen by Claude (`collect_news.py` +
            `classify_news.py`). Check `data/releases.json` and `data/news.json` in the
            Files tab. Merge to publish, close to discard.
