<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{ $title := cond .IsHome site.Title (printf "%s | %s" .Title site.Title) }}
<title>{{ $title }}</title>
{{ $desc := or .Description "とぼけがお (Tobokegao) — チップチューン、合成音声、音MAD、素のMIDI音源。" }}
<meta name="description" content="{{ $desc }}">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $desc }}">
<meta property="og:type" content="{{ cond .IsPage "article" "website" }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ "img/tobokegao.png" | absURL }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:site" content="@to6okegao">
<meta name="theme-color" content="#006599">
<link rel="icon" href="{{ "favicon.ico" | relURL }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ "icon-192.png" | relURL }}">
<link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">
<script>
/* Language and color scheme are applied before the first paint, so switching never reloads the page. */
(function () {
  var d = document.documentElement, l, s;
  try { l = localStorage.getItem("tbk-lang"); s = localStorage.getItem("tbk-scheme"); } catch (e) {}
  if (l !== "ja" && l !== "en") l = /^ja\b/i.test(navigator.language || "ja") ? "ja" : "en";
  d.dataset.lang = l; d.lang = l;
  if (s === "night") d.dataset.scheme = "night";
})();
</script>
<link rel="preload" href="{{ "fonts/gen/dot12.woff2" | relURL }}" as="font" type="font/woff2" crossorigin media="(max-width: 59.99rem)">
<link rel="preload" href="{{ "fonts/gen/pc-ja.woff2" | relURL }}" as="font" type="font/woff2" crossorigin media="(min-width: 60rem)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;700&display=swap">
{{ $css := resources.Get "css/site.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
