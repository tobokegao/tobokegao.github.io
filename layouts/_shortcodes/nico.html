{{- /* A niconico video (the ID, e.g. sm46932309): one player for both languages, put between the
   lang blocks, with a link to the page on niconico under it. The CSP's frame-src allows only this host. */ -}}
{{- $id := .Get 0 -}}
<figure class="nico">
  <iframe class="nico__player" src="https://embed.nicovideo.jp/watch/{{ $id }}" width="640" height="360" loading="lazy" allow="autoplay; fullscreen" allowfullscreen title="{{ .Page.Title }}: niconico"></iframe>
  <figcaption class="nico__cap"><a href="https://www.nicovideo.jp/watch/{{ $id }}" rel="noopener" target="_blank">{{ partial "bi.html" (dict "ja" "ニコニコ動画で見る" "en" "Watch on niconico") }}</a></figcaption>
</figure>
