baseURL = "https://tobokegao.github.io/"
title = "とぼけがお Tobokegao"
locale = "ja"
defaultContentLanguage = "ja"
enableRobotsTXT = true

disableKinds = ["taxonomy", "term"]
timeZone = "Asia/Tokyo"

[markup.goldmark.renderer]
  unsafe = true
  hardWraps = true

[params]
  artist = "Tobokegao"
  label = "TBKgao"

  # Order here is the order of the link buttons on the home page.
  # grouped: social, video, music, communities
  [[params.links]]
    name = "Twitter(X)"
    icon = "x"
    url = "https://x.com/to6okegao"
  [[params.links]]
    name = "Bluesky"
    icon = "bluesky"
    url = "https://bsky.app/profile/tobokegao.bsky.social"
  [[params.links]]
    name = "Instagram"
    icon = "instagram"
    url = "https://www.instagram.com/tobokegao/"
  [[params.links]]
    name = "YouTube"
    icon = "youtube"
    url = "https://www.youtube.com/c/to6okegao"
  [[params.links]]
    name = "niconico"
    icon = "niconico"
    url = "https://www.nicovideo.jp/user/12289597"
  [[params.links]]
    name = "SoundCloud"
    icon = "soundcloud"
    url = "https://soundcloud.com/tobokegao"
  [[params.links]]
    name = "Mixcloud"
    icon = "mixcloud"
    url = "https://www.mixcloud.com/%E3%81%A8%E3%81%BC%E3%81%91%E3%81%8C%E3%81%8A/"
  [[params.links]]
    name = "Bandcamp"
    icon = "bandcamp"
    url = "https://tbkgao.bandcamp.com/music"
  [[params.links]]
    name = "Spotify"
    icon = "spotify"
    url = "https://open.spotify.com/artist/2ZW0H3Dntod1TN6dUFKY3v"
  [[params.links]]
    name = "Apple Music"
    icon = "apple"
    url = "https://music.apple.com/jp/artist/tobokegao/1532385760"
  [[params.links]]
    name = "Weeklybeats"
    icon = "weeklybeats"
    url = "https://weeklybeats.com/tobokegao"
  [[params.links]]
    name = "Battle of the Bits"
    icon = "botb"
    url = "https://battleofthebits.com/barracks/Profile/tobokegao/"
  [[params.links]]
    name = "GitHub"
    icon = "github"
    url = "https://github.com/tobokegao"

  # Under the link buttons, in a row of their own: things Tobokegao made, each with its
  # own page (icons from their favicons, made by scripts/hd_icons.py like the links).
  # about: a key in data/strings.toml; the icon then first opens a small window with that
  # text and a button to the site (file: the window's title), see docs/decisions/0040
  [[params.projects]]
    name = "TRACKMENTO"
    icon = "trackmento"
    url = "https://trackmento.com/"
    about = "aboutTrackmento"
    file = "TRACKMENTO.URL"
  [[params.projects]]
    name = "ReaScratch"
    icon = "reascratch"
    url = "/reascratch/"

# The flyers stay in static/ (the card links to the full-size file) and are also
# mounted into assets/, so the Designs page can show a smaller copy of each.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/img/designs"
    target = "assets/img/designs"
  [[module.mounts]]
    source = "static"
    target = "static"

# The early script is inlined with its hash in the CSP (head.html). hugo --minify minifies the
# page's HTML again, inline scripts too, and renamed the script's variables a second time, so
# the hash no longer matched and the browser blocked it (found 2026-10-26: the stored language
# and an English browser both got Japanese). Keeping the names makes the second pass change nothing.
[minify.tdewolff.js]
  keepVarNames = true

# A small English page next to every page, for link previews (Bluesky and others read the
# title and description from the HTML, before any script switches the language): /en/<path>/
# holds only the English title, description and picture, and sends people on to the page
# itself in English. Made by layouts/all.card.html; see docs/decisions/0041.
[outputFormats.card]
  mediaType = "text/html"
  path = "en"
  baseName = "index"
  isHTML = true
  noAlternative = true

[outputs]
  home = ["html", "rss", "card"]
  section = ["html", "rss", "card"]
  page = ["html", "card"]
