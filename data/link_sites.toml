# Sites linked from the bottom of LINKS.HTM on the top page.
# Banners are saved copies in static/img/links/ (no hotlinking), lined up at 40 high (200x40 as they are;
# other sizes keep their shape at 40 high, width rounded to whole pixels).
# pixel = true: pixel art, drawn dot for dot like our own banners; otherwise a smooth picture with a 2x copy.
# small = true: a small button (88x31, 100x35 ...), on its own row at actual size (always pixel = true).
# still: the first frame of a moving banner, shown to people who ask for reduced motion.
# When a site renews its banner, save it again.

