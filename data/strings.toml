[linkBanners]
ja = "相互（でなくてもOKな）リンク用バナー"
en = "Link banners (no need to link back)"

[linkBannersNote]
ja = "どれも実寸で並べています（468×60、200×40、88×31）。ドットがにじまないよう、画面に合わせてドットをきれいに拡大して表示しているため、画面によっては少し大きく見えます。拡大や縮小をするとドットがにじむので、この大きさのまま貼ってください。動かないものがよければ「静止画版」を使ってください。"
en = "All shown at actual size (468×60, 200×40, 88×31). To keep the pixel art crisp, they are scaled by whole screen pixels, so they may look slightly larger on some screens. Resizing blurs the pixels, so please use them at this size. If you prefer one that does not move, please use the still version."

[linkBannersFree]
ja = "リンクはご自由にどうぞ。バナーは今後描き直すことがあるので、画像のURLをそのまま貼り付けて使っていただいても大丈夫です（描き直したときは、自動で新しい絵に変わります）。もちろん、画像を保存して使っていただいてもかまいません。"
en = "Feel free to link to this site. The banners may be updated in the future, so feel free to link directly to the image (it will update automatically). You are also welcome to save a copy and host it yourself."

