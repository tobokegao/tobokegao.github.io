# Tags for the tools in content/post/2026-chiptune-tools.md (0044). The article stays the source
# of the text; this file only sorts it. check.py stops the build if a tool has no entry here.
# An entry is found by its bold name and link, so edit both places together. name_en is there
# only when the English name differs. A tool needs a tag from "kind"; the other axes are
# left out when they say nothing (a plugin for no chip in particular has no chip tag).

[[axis]]
key = "kind"
ja = "種類"
en = "Type"
tags = [
  { id = "plugin", ja = "プラグイン", en = "Plugins" },
  { id = "effect", ja = "エフェクト", en = "Effects" },
  { id = "tracker", ja = "トラッカー・作曲ソフト", en = "Trackers and music software" },
  { id = "mml", ja = "MML", en = "MML" },
  { id = "hardware", ja = "ハードウェア", en = "Hardware" },
  { id = "samples", ja = "サンプルパック", en = "Sample packs" },
  { id = "sfx", ja = "効果音", en = "Sound effects" },
  { id = "tool", ja = "再生・変換・補助", en = "Players and utilities" },
  { id = "legacy", ja = "昔のプラグイン", en = "Older plugins" },
]

[[axis]]
key = "chip"
ja = "音源"
en = "Sound"
tags = [
  { id = "nes", ja = "ファミコン", en = "NES" },
  { id = "gb", ja = "GAMEBOY", en = "GAMEBOY" },
  { id = "sid", ja = "SID", en = "SID" },
  { id = "fm", ja = "FM音源", en = "FM" },
  { id = "psg", ja = "PSG", en = "PSG" },
  { id = "snes", ja = "スーパーファミコン", en = "SNES" },
  { id = "sega", ja = "セガ", en = "Sega" },
  { id = "amiga", ja = "Amiga", en = "Amiga" },
  { id = "atari", ja = "Atari", en = "Atari" },
  { id = "msx", ja = "MSX", en = "MSX" },
  { id = "jpc", ja = "X68000・PC-98", en = "X68000 / PC-98" },
]

[[axis]]
key = "os"
ja = "動く場所"
en = "Runs on"
tags = [
  { id = "win", ja = "Windows", en = "Windows" },
  { id = "mac", ja = "Mac", en = "Mac" },
  { id = "linux", ja = "Linux", en = "Linux" },
  { id = "phone", ja = "スマホ", en = "Mobile" },
  { id = "web", ja = "ブラウザ", en = "Browser" },
  { id = "real", ja = "実機", en = "Real hardware" },
]

[[axis]]
key = "price"
ja = "値段"
en = "Price"
tags = [
  { id = "free", ja = "無料", en = "Free" },
  { id = "paid", ja = "有料", en = "Paid" },
]

